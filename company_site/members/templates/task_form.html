{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3">
                <h6 class="fw-bold mb-0 text-uppercase text-muted">{{ title }}</h6>
            </div>
            <div class="card-body p-4 pt-0">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-2">
                        <label class="form-label small fw-bold text-muted mb-1">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-sm fw-bold">Save Task</button>
                        <a href="{% url 'admin_dashboard' %}" class="btn btn-light btn-sm text-muted">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
