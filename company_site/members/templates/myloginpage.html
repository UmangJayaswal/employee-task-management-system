{% extends 'base.html' %}

{% block title %}Login | Company Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                    <h2 class="fw-bold">Sign In</h2>
                    <p class="text-muted">Enter your credentials below</p>
                </div>

                {% if error %}
                <div class="alert alert-danger d-flex align-items-center rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form action="{% url 'login_user' %}" method="POST">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                       <label class="form-label small fw-bold text-muted text-uppercase">Password</label>
                       <div class="input-group">
                       <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
        
                       <input type="password" name="password" id="passwordInput" class="form-control border-start-0 border-end-0 bg-light" placeholder="••••••••"  required>
        
                       <button class="btn btn-light border border-start-0 bg-light" type="button" id="togglePassword">
                           <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                       </button>
                       </div>
                     </div>
                    <div class="form-check mb-4">
                      <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                       <label class="form-check-label small text-muted" for="rememberMe">
                         Keep me logged in
                        </label>
                    </div>
    		         <a href="{% url 'password_reset' %}" class="small text-decoration-none">Forgot password?</a>
		    </div>

                   <div class="d-grid">
                       <button type="submit" id="loginBtn" class="btn btn-primary py-2 fw-bold shadow-sm rounded-3">
                           <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
        
                           <span id="loginText">Sign In <i class="bi bi-arrow-right ms-1"></i></span>
                       </button>
                   </div>
		   <div class="text-center mt-4">
   			   <p class="small text-muted">New here? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Create an account</a></p>
		   </div>
                </form>
               <script>
                const loginForm = document.querySelector('form');
                const loginBtn = document.getElementById('loginBtn');
                const loginSpinner = document.getElementById('loginSpinner');
                const loginText = document.getElementById('loginText');

               loginForm.addEventListener('submit', function() {
               // 1. Disable the button so they can't click twice
               loginBtn.disabled = true;
        
               // 2. Show the spinner (remove the "d-none" class)
                loginSpinner.classList.remove('d-none');
        
                // 3. Optional: Change the text to "Signing in..."
                   loginText.innerText = "Signing in...";
             });
              </script>
              <script>
                const togglePassword = document.querySelector('#togglePassword');
                const passwordInput = document.querySelector('#passwordInput');
                const eyeIcon = document.querySelector('#eyeIcon');

               togglePassword.addEventListener('click', function () {
              // Toggle the type attribute
               const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
               passwordInput.setAttribute('type', type);
        
              // Toggle the eye icon (Bootstrap Icons)
              eyeIcon.classList.toggle('bi-eye');
               eyeIcon.classList.toggle('bi-eye-slash');
               });
            </script>
            </div>
        </div>
        <p class="text-center text-muted mt-4 small">© 2026 Company Site. All rights reserved.</p>
    </div>
</div>
{% endblock %}
