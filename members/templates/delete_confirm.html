{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm mt-5 mx-auto" style="max-width: 500px;">
    <div class="card-body text-center">
        <h3 class="text-danger">Delete Task?</h3>
        <p>Are you sure you want to delete <strong>"{{ task.title }}"</strong>? This cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger fw-bold">Yes, Delete</button>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
